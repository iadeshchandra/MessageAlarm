name: 🔔 Build & Sign Release APK

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Signed Release APK
    runs-on: ubuntu-latest

    steps:

      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: ☕ Set Up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: 📦 Download Gradle Wrapper JAR
        run: |
          mkdir -p gradle/wrapper
          curl -fsSL \
            "https://github.com/gradle/gradle/raw/v8.6.0/gradle/wrapper/gradle-wrapper.jar" \
            -o gradle/wrapper/gradle-wrapper.jar
          echo "✅ gradle-wrapper.jar ready"

      - name: 💾 Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', '**/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: 🔑 Make gradlew Executable
        run: chmod +x gradlew

      - name: 🔐 Auto-Generate Release Keystore
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          keytool -genkey -v \
            -keystore app/release-key.jks \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -alias message-alarm-key \
            -storepass "$KEYSTORE_PASSWORD" \
            -keypass "$KEYSTORE_PASSWORD" \
            -dname "CN=Adesh Chandra, OU=MessageAlarm, O=AdeshChandra, L=Unknown, ST=Unknown, C=US"
          echo "✅ Keystore generated by GitHub automatically"

      - name: 🔍 Run Lint Check
        run: ./gradlew lintRelease
        continue-on-error: true

      - name: 🏗️ Build Release APK
        env:
          KEYSTORE_PATH: release-key.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: message-alarm-key
          KEY_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      - name: ✅ Verify APK Signature
        run: |
          APK=$(find app/build/outputs/apk/release -name "*.apk" | head -1)
          BUILD_TOOLS=$ANDROID_HOME/build-tools/$(ls $ANDROID_HOME/build-tools | sort -V | tail -1)
          $BUILD_TOOLS/apksigner verify --verbose "$APK"
          echo "✅ APK is properly signed — Play Protect safe"

      - name: 🧹 Remove Keystore
        if: always()
        run: rm -f app/release-key.jks

      - name: 📝 Rename APK
        run: |
          VERSION=$(grep 'versionName' app/build.gradle.kts | head -1 | grep -oP '"\K[^"]+')
          APK=$(find app/build/outputs/apk/release -name "*.apk" | head -1)
          cp "$APK" "app/build/outputs/apk/release/MessageAlarm-v${VERSION}-release.apk"
          echo "✅ APK renamed"

      - name: 📤 Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MessageAlarm-Release-APK
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30
          if-no-files-found: error

      - name: 📋 Upload Lint Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lint-report
          path: app/build/reports/lint-results-release.html
          retention-days: 7

      - name: 🚀 Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/*.apk
          name: "Message Alarm ${{ github.ref_name }}"
          body: |
            ## 🔔 Message Alarm ${{ github.ref_name }}

            ### Features
            - Alarm for any app notification
            - Upwork Best Matches detection
            - Fiverr new message and order alerts
            - Full-screen alarm with Stop and Snooze
            - Custom sound, vibration, repeat and DND schedule

            ### Installation
            1. Download the APK below
            2. On your phone go to Settings and allow Install unknown apps
            3. Install the APK
            4. Open the app, tap Grant Permission and enable Notification Access

            Developed by Adesh Chandra - https://fiverr.com/adesh_chandra
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
